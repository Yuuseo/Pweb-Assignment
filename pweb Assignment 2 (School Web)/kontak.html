<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <title>SMA Negeri 1 Jember - Kontak</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="https://placehold.co/100x100/1e3a8a/ffffff?text=SMASA" alt="Logo SMA Negeri 1 Jember">
            <h1>SMA Negeri 1 Jember</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="jurusan.html">Jurusan</a></li>
                <li><a href="kontak.html" class="active">Kontak</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="info-kontak">
            <h2>Informasi Kontak Resmi</h2>
            <p><strong>Alamat:</strong> Jl. Letjen Panjaitan No. 42, Jember, Jawa Timur</p>
            <p><strong>Telepon:</strong> (0331) 338586</p>
            <p><strong>Email:</strong> sekolah@sman1jember.sch.id</p>
        </section>

        <section class="form-kontak">
            <h2>Hubungi Kami</h2>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="nama">Nama Lengkap:</label>
                    <input type="text" id="nama" name="nama" required placeholder="Nama Anda...">
                </div>

                <div class="form-group">
                    <label for="email">Alamat Email:</label>
                    <input type="email" id="email" name="email" required placeholder="Email Anda...">
                </div>

                <div class="form-group">
                    <label for="pesan">Pesan:</label>
                    <textarea id="pesan" name="pesan" rows="5" required placeholder="Tuliskan pesan Anda..."></textarea>
                </div>

                <button type="submit">Kirim Pesan</button>
            </form>
        </section>
    </main>
